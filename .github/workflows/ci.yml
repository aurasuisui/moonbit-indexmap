name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MoonBit
        uses: actions/setup-moonbit@v1
        with:
          moonbit-version: latest

      - name: Type check
        run: moon check

      - name: Run tests
        run: moon test
