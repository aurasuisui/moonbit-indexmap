name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MoonBit
        uses: hustcer/setup-moonbit@v1
        with:
          version: latest
          # To pin a specific toolchain version, set version to a value like
          # '0.1.20260629+3e587ed' (see `moon version` output). Using 'latest'
          # here because the project is kept compatible with the current
          # toolchain.

      - name: Format check
        run: moon fmt --check

      - name: Type check
        run: moon check

      - name: Run tests
        run: moon test

      - name: Build
        run: moon build
