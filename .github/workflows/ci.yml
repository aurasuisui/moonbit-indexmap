name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # Pre-flight gates that need only run once (not per backend).
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MoonBit
        uses: hustcer/setup-moonbit@v1
        with:
          version: latest

      - name: Format check
        run: moon fmt --check

      - name: Type check (warnings are errors)
        run: moon check --deny-warn

      - name: Interface check (mbti up-to-date)
        run: |
          moon info
          git diff --exit-code

  # Cross-backend / cross-mode test + build matrix.
  test:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      # One flaky/unsupported cell must not cancel the others.
      fail-fast: false
      matrix:
        target: [wasm-gc, wasm, js, native]
        mode: [debug, release]
    steps:
      - uses: actions/checkout@v4

      - name: Setup MoonBit
        uses: hustcer/setup-moonbit@v1
        with:
          version: latest

      # The native backend compiles via a system C toolchain.
      - name: Install C toolchain (native backend)
        if: matrix.target == 'native'
        run: sudo apt-get update && sudo apt-get install -y gcc

      - name: Test (${{ matrix.target }}, ${{ matrix.mode }})
        run: |
          FLAGS="--target ${{ matrix.target }}"
          if [ "${{ matrix.mode }}" = "release" ]; then FLAGS="$FLAGS --release"; fi
          moon test $FLAGS

      - name: Build (${{ matrix.target }}, ${{ matrix.mode }})
        run: |
          FLAGS="--target ${{ matrix.target }}"
          if [ "${{ matrix.mode }}" = "release" ]; then FLAGS="$FLAGS --release"; fi
          moon build $FLAGS

  # Compile and run each cmd/ example against the LOCAL library. cmd/* are
  # workspace members (see moon.work), resolved via the workspace rather than
  # the mooncakes registry — so this job is registry-independent. The `check`
  # job already type-checks them; this job RUNS them to verify runtime behavior.
  examples:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MoonBit
        uses: hustcer/setup-moonbit@v1
        with:
          version: latest

      - name: Run each example (local library via workspace)
        run: |
          set -e
          for d in lru_cache config_parse json_order; do
            echo "::group::cmd/$d"
            moon run "cmd/$d"
            echo "::endgroup::"
          done
